[pytest]
testpaths = .
addopts = -ra
timeout = 120
# pexpect forks the IOC from a process already running pyads/p4p threads; the child execs right away
filterwarnings =
    ignore:This process .* is multi-threaded, use of forkpty:DeprecationWarning
markers =
    disruptive: restarts the ADS server or changes the PLC state; runs after all other tests
