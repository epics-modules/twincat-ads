# This is YAML - indentation levels are crucial

# Workflow name

name: workflow-clang-format

# Trigger on pushes and PRs to any branch
on:
  push:
  pull_request:

jobs:
  run-clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install and run clang format
        run: |
          python3 -m venv "$RUNNER_TEMP/pre-commit-venv"
          "$RUNNER_TEMP/pre-commit-venv/bin/python" -m pip install pre-commit
          "$RUNNER_TEMP/pre-commit-venv/bin/pre-commit" run --all-files

      - name: check whitespace damage
        run: |
          ./tools/checkws.sh
