name: twincat-ads

# Trigger on pushes and PRs to any branch
on:
  push:
    paths-ignore:
      - "docs/*"
      - "**/*.html"
      - "**/*.md"
  pull_request:

env:
  SETUP_PATH: .ci-local:.ci
  MODULES: "asyn"

jobs:
  build-base:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Set environment variables from matrix parameters
    env:
      CMP: ${{ matrix.cmp }}
      BCFG: ${{ matrix.configuration }}
      BASE: ${{ matrix.base }}
      APT: libtirpc-dev
    strategy:
      fail-fast: false
      matrix:
        # Job names also name artifacts, character limitations apply
        include:
          - os: ubuntu-latest
            cmp: gcc
            configuration: default
            base: "R7.0.9"
            name: "7.0.9 Ubuntu latest"

          - os: ubuntu-22.04
            cmp: gcc
            configuration: default
            base: "R7.0.9"
            name: "7.0.9 Ubuntu 22.04"

          - os: macos-latest
            cmp: gcc
            base: "R7.0.9"
            configuration: default
            name: "R7.0.9 MacOS latest"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Prepare and compile dependencies
        run: python .ci/cue.py prepare

      - name: Build main module
        run: python .ci/cue.py build

      - name: Run main module tests
        run: python .ci/cue.py -T 15M test

      - name: Collect and show test results
        if: ${{ always() }}
        run: python .ci/cue.py -T 5M test-results

      - name: Set up Python for integration tests
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build test IOC
        if: runner.os == 'Linux'
        run: make -C tests/ioc

      - name: Install integration test dependencies
        if: runner.os == 'Linux'
        run: pip install -r tests/requirements.txt

      - name: Run integration tests
        if: runner.os == 'Linux'
        working-directory: tests
        run: python -m pytest -v --junitxml=logs/junit.xml

      - name: Upload integration test logs
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs ${{ matrix.name }}
          path: tests/logs/
